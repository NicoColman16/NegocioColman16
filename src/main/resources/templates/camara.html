<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Auditoría de Caja - Video en Vivo</title>
  <!-- Librería HLS.js desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <h2>Cámara de Seguridad - Caja Registradora</h2>
  
  <!-- Contenedor estándar de Video HTML5 -->
  <video id="videoCaja" controls autoplay muted width="640" height="360"></video>

  <script>
    const video = document.getElementById('videoCaja');
    // Ruta servida por tu Spring Boot (archivo generado por FFmpeg)
    const videoSrc = '/live/stream.m3u8';

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play();
      });
    } 
    // Compatibilidad nativa para Safari / iOS
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = videoSrc;
      video.addEventListener('loadedmetadata', function() {
        video.play();
      });
    }
  </script>

</body>
</html>
