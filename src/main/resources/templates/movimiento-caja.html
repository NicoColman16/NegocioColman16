<!DOCTYPE html>
<html lang="es">
<head xmlns:th= "http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Ajustes y Movimientos de Caja - El Patito</title>
    <!-- Aquí mantienes tu head o enlaces de Bootstrap / CSS habituales -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <head th:replace="~{/fragments/head :: head}"></head>

</head>
<body>

    <!-- Sidebar -->
    <div th:replace="~{/fragments/sidebar :: div}"></div>

    <!-- Contenido Principal -->
    <div class="main-wrapper">
    <!-- Topbar -->
    <div th:replace="~{/fragments/nuevonav :: div}"></div>

        <!-- Header de Contenido -->
    <div class="content-header">
      <h2>Movimiento de Caja</h2>
      <div class="breadcrumb">
        <a href="/">Inicio</a> / Mov.Caja
      </div>
    </div>

            <div class="container py-4">
        

        <!-- Alerta de éxito -->
        <div th:if="${param.exito}" class="alert alert-success alert-dismissible fade show" role="alert">
            Movimiento registrado correctamente.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Formulario de Registro -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-shuffle"></i> Nuevo Traspaso / Cambio de Saldo</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/caja/movimientos/guardar}" method="post" class="row g-3" id="formMovimiento">
    
    <div class="col-md-4">
        <label for="responsable" class="form-label">Nombre del Responsable:</label>
        <input type="text" class="form-control" id="responsable" name="responsable" required placeholder="Ej. Nicolás">
    </div>

    <!-- Monto Base que ingresa el usuario -->
    <div class="col-md-4">
        <label for="monto" class="form-label">Monto Base:</label>
        <input type="number" step="0.01" class="form-control" id="monto" name="monto" required placeholder="0.00">
    </div>

    <div class="col-md-4">
        <label for="origenMedio" class="form-label text-danger fw-bold"><i class="bi bi-dash-circle"></i> Resta (Entregado):</label>
        <select class="form-select border-danger" id="origenMedio" name="origenMedio" required>
            <option value="EFECTIVO">Efectivo</option>
            <option value="TARJETA">Tarjeta</option>
            <option value="TRANSFERENCIA">Transferencia</option>
        </select>
    </div>

    <div class="col-md-4">
        <label for="destinoMedio" class="form-label text-success fw-bold"><i class="bi bi-plus-circle"></i> Suma (Recibido):</label>
        <select class="form-select border-success" id="destinoMedio" name="destinoMedio" required>
            <option value="TRANSFERENCIA" selected>Transferencia</option>
            <option value="EFECTIVO">Efectivo</option>
            <option value="TARJETA">Tarjeta</option>
        </select>
    </div>

    <div class="col-md-8">
        <label for="motivo" class="form-label">Motivo u Observación:</label>
        <input type="text" class="form-control" id="motivo" name="motivo" placeholder="Ej. Cambio de efectivo por transferencia">
    </div>

    <!-- NUEVO: Etiqueta para mostrar el cálculo en tiempo real -->
    <div class="col-12">
        <div class="alert alert-info py-2 mb-0">
            <i class="bi bi-calculator"></i> Monto final con recargo aplicado: 
            <strong id="textoMontoFinal" class="fs-5 text-dark">$ 0.00</strong>
        </div>
    </div>

    <div class="col-12 mt-3">
        <button type="submit" class="btn btn-success">
            <i class="bi bi-check-lg"></i> Registrar Movimiento
        </button>
    </div>
</form>
            </div>
        </div>

        <!-- Historial de Movimientos -->
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0"><i class="bi bi-clock-history"></i> Historial de Ajustes</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Fecha / Hora</th>
                                <th>Responsable</th>
                                <th>Monto</th>
                                <th>Sale de (-)</th>
                                <th>Entra a (+)</th>
                                <th>Motivo</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${movimientos}">
                                <td th:text="${#temporals.format(m.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${m.responsable}"></td>
                                <td class="fw-bold text-primary" th:text="${'$ ' + m.monto}"></td>
                                <td><span class="badge bg-danger" th:text="${m.origenMedio}"></span></td>
                                <td><span class="badge bg-success" th:text="${m.destinoMedio}"></span></td>
                                <td th:text="${m.motivo}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(movimientos)}">
                                <td colspan="6" class="text-center text-muted">No hay movimientos registrados todavía.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/caja.js"></script>
</body>
</html>
