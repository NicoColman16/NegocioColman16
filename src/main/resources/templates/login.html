<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Sistema de Caja</title>
    <!-- Asegúrate de tener tu enlace de Bootstrap o CDN si ya lo usas globalmente -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm p-4 border-0" style="width: 100%; max-width: 400px;">
        <div class="card-body">
            
            <!-- Encabezado -->
            <div class="text-center mb-4">
                <i class="fa-solid fa-lock text-primary fs-1 mb-2"></i>
                <h3 class="card-title fw-bold text-dark">Acceso al Sistema</h3>
                <p class="text-muted small">Ingresa tus credenciales para continuar</p>
            </div>

            <!-- Alerta si hay error en las credenciales -->
            <div th:if="${param.error}" class="alert alert-danger text-center py-2 small" role="alert">
                Usuario o contraseña incorrectos.
            </div>
            
            <!-- Alerta si cerró sesión -->
            <div th:if="${param.logout}" class="alert alert-success text-center py-2 small" role="alert">
                Has cerrado sesión exitosamente.
            </div>

            <!-- Formulario de Login -->
            <form th:action="@{/login}" method="post">
                
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Ingresa tu usuario" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-key text-muted"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Ingresar
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
