<!DOCTYPE html>
<html lang="es">
<head xmlns:th= "http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Patito - Venta</title>
  <!-- Iconos FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="src\main\resources\static\css\producto.css">
  <head th:replace="~{/fragments/head :: head}"></head>
  
</head>
<body>

  <!-- Sidebar -->
    <div th:replace="~{/fragments/sidebar :: div}"></div>


<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-primary text-white py-3">
          <h5 class="mb-0 fw-bold"><i class="fa-solid fa-box-archive me-2"></i>Cargar Nuevo Producto</h5>
        </div>
        <div class="card-body p-4">
          <form id="formCargarProducto" th:action="@{/productos/guardar}" method="POST">
            
            <!-- Código de barras con scanner listener -->
            <div class="mb-3">
              <label for="codigoBarra" class="form-label fw-bold">Código de Barras</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-barcode"></i></span>
                <input type="text" class="form-control form-control-lg border-primary" id="codigoBarra" name="codigoBarra" placeholder="Escanee o ingrese el código de barras" autofocus autocomplete="off" required>
                <button class="btn btn-outline-secondary" type="button" id="btnGenerarRandom" title="Generar código interno">
                  <i class="fa-solid fa-wand-magic-sparkles"></i>
                </button>
              </div>
              <small class="form-text text-muted">Asegúrese de tener enfocado este campo al usar el lector físico.</small>
            </div>

            <div class="row">
              <div class="col-md-8 mb-3">
                <label for="nombre" class="form-label fw-bold">Nombre / Descripción del Producto</label>
                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Coca Cola 2.25L" required>
              </div>
              <div class="col-md-4 mb-3">
                <label for="tipoProducto" class="form-label fw-bold">Categoría</label>
                <input type="text" class="form-control" id="tipoProducto" name="tipoProducto" placeholder="Ej: Bebidas, Almacén" required>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="precioVenta" class="form-label fw-bold">Precio de Venta ($)</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input type="number" step="0.01" min="0" class="form-control" id="precioVenta" name="precioVenta" placeholder="0.00" required>
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label for="stockActual" class="form-label fw-bold">Cantidad / Stock Inicial</label>
                <input type="number" min="0" class="form-control" id="stockActual" name="stockActual" value="0" required>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="reset" class="btn btn-light px-4">Limpiar</button>
              <button type="submit" class="btn btn-primary px-4 fw-bold">
                <i class="fa-solid fa-floppy-disk me-2"></i>Guardar Producto
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
    <script src="/js/producto.js"></script>

</body>
