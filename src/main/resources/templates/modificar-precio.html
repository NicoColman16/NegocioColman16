<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Patito - Modificar Producto</title>
  
  <head th:replace="~{/fragments/head :: head}"></head>
  <!-- Link CSS estático adaptado a la ruta pública de Spring Boot -->
  <link rel="stylesheet" th:href="@{/css/producto.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Sidebar -->
  <div th:replace="~{/fragments/sidebar :: div}"></div>

<form th:action="@{/producto/guardar}" method="post" th:object="${productoEditar}">
    
    <!-- ID oculto imprescindible para hacer un UPDATE exacto en MySQL -->
    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label>Código de Barras:</label>
        <input type="text" class="form-control" th:field="*{codigoBarras}" readonly />
    </div>

    <div class="mb-3">
        <label>Nombre del Producto:</label>
        <input type="text" class="form-control" th:field="*{nombre}" />
    </div>

    <div class="mb-3">
        <label>Precio ($):</label>
        <input type="number" step="0.01" class="form-control" th:field="*{precio}" />
    </div>

    <button type="submit" class="btn btn-success">Guardar Cambios</button>
</form>
  <script th:src="@{/js/producto.js}"></script>
</body>
</html>
