<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo en Vivo - DVR Gadnic</title>
    <!-- Librería para reproducir HLS en navegadores que no lo soportan de forma nativa -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            width: 90%;
        }
        video {
            width: 100%;
            height: auto;
            border-radius: 8px;
            background-color: #000;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #4caf50;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Transmisión en Vivo - Auditoría POS</h2>
        <video id="videoPlayer" controls autoplay muted></video>
        <div class="status">🟢 Transmisión activa desde DVR Gadnic</div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const streamUrl = '/live/stream.m3u8';

        if (Hls.isSupported()) {
            const hls = new Hls({
                manifestLoadingTimeOut: 10000,
                manifestLoadingMaxRetry: 10
            });
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function () {
                video.play();
            });
        }
    </script>
</body>
</html>
